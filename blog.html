<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>博客列表 | Serverless</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: "Georgia", "Times New Roman", serif; background-color: #fdfdfd; color: #111; line-height: 1.7; }
        .tab-btn { background: none; border: none; font-size: 0.85rem; color: #666; cursor: pointer; padding: 2px 8px; margin-right: 8px; border-radius: 4px; }
        .tab-btn.active { background: #eee; color: #000; font-weight: bold; }
    </style>
</head>
<body class="max-w-2xl mx-auto px-6 py-16 flex flex-col min-h-screen">
    <header class="mb-12 flex justify-between items-baseline border-b border-gray-200 pb-6">
        <h1 class="text-3xl font-bold">Writings <span class="text-gray-400 text-sm font-normal italic">/ API Driven</span></h1>
        <nav class="text-sm">
            <a href="index.html" class="text-blue-600 hover:underline">返回首页</a>
        </nav>
    </header>

    <main class="flex-1">
        <div class="mb-6 flex flex-col sm:flex-row justify-between items-start sm:items-center text-sm border-b border-gray-100 pb-4">
            <div id="category-tabs" class="mb-2 sm:mb-0 flex flex-wrap">
                <button class="tab-btn active" onclick="setCategory(null)">全部</button>
            </div>
        </div>

        <div id="loading-msg" class="text-gray-500 italic">正在从 GitHub 获取最新的文章与配置数据...</div>
        <ul id="blog-list" class="space-y-6 flex-1">
            <!-- 动态生成 -->
        </ul>
    </main>

    <script>
        const GITHUB_USERNAME = "faderaljim";
        const GITHUB_REPO = "ustc-homepage";

        let fullFiles = [];
        let categories = [];
        let blogMeta = {};
        let currentCatId = null;

        function base64ToUtf8(str) { return decodeURIComponent(escape(window.atob(str))); }

        document.addEventListener("DOMContentLoaded", async () => {
            try {
                const configUrl = `https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/config.json`;
                const blogsUrl = `https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/blogs/`;
                
                const [configRes, blogsRes] = await Promise.all([
                    fetch(configUrl),
                    fetch(blogsUrl)
                ]);

                if(configRes.ok) {
                    const data = await configRes.json();
                    let config = JSON.parse(base64ToUtf8(data.content));
                    categories = config.categories || [];
                    blogMeta = config.blogMeta || {};
                }

                const tabsEl = document.getElementById("category-tabs");
                categories.forEach(c => {
                    const btn = document.createElement("button");
                    btn.className = "tab-btn";
                    btn.textContent = c.name;
                    btn.onclick = () => setCategory(c.id);
                    tabsEl.appendChild(btn);
                });

                if(!blogsRes.ok) throw new Error("Blogs Dir Fetch Fail");
                const filesData = await blogsRes.json();
                fullFiles = filesData.filter(f => f.name.endsWith('.md'));

                document.getElementById("loading-msg").style.display = "none";
                renderList();

            } catch (error) {
                document.getElementById("loading-msg").textContent = "❌ " + error.message;
            }
        });

        function setCategory(id) {
            currentCatId = id;
            const btns = document.querySelectorAll(".tab-btn");
            btns.forEach(b => b.classList.remove("active"));
            
            if(id === null) {
                btns[0].classList.add("active");
            } else {
                const targetBtn = Array.from(btns).find(b => b.textContent === categories.find(c => c.id == id).name);
                if(targetBtn) targetBtn.classList.add("active");
            }
            renderList();
        }

        function renderList() {
            const listEl = document.getElementById("blog-list");
            listEl.innerHTML = "";

            // Decorate file items with meta info
            let displayFiles = fullFiles.map(f => {
                const meta = blogMeta[f.name] || {};
                return {
                    name: f.name,
                    size: f.size,
                    categoryId: meta.categoryId || null
                };
            });

            // Filter
            if (currentCatId !== null) {
                displayFiles = displayFiles.filter(item => item.categoryId == currentCatId);
            }

            // Sort default (naive newest approach: github default puts newer created files logic often by name or just reverse)
            displayFiles.sort((a,b) => b.name.localeCompare(a.name));

            // Generate sequence array for article inner nav hook
            const orderedNames = displayFiles.map(i => i.name);
            sessionStorage.setItem("orderedBlogNames", JSON.stringify(orderedNames));

            if(displayFiles.length === 0) {
                listEl.innerHTML = "<p class='text-gray-400 italic text-sm'>此分类下暂无文章。</p>";
                return;
            }

            displayFiles.forEach(item => {
                let catName = "无栏目";
                if(item.categoryId) catName = categories.find(c => c.id == item.categoryId)?.name || catName;

                const li = document.createElement("li");
                li.innerHTML = `
                    <h2 class="text-lg font-bold mb-1">
                        <a href="article.html?file=${encodeURIComponent(item.name)}" class="text-blue-600 hover:underline">${item.name.replace('.md', '')}</a>
                    </h2>
                    <div class="text-xs text-gray-500 font-mono flex gap-4">
                        <span>[${catName}]</span>
                    </div>
                `;
                listEl.appendChild(li);
            });
        }
    </script>
</body>
</html>
