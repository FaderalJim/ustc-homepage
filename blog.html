<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>博客列表</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: "Georgia", "Times New Roman", serif; background-color: #fdfdfd; color: #111; line-height: 1.7; }
    </style>
</head>
<body class="max-w-2xl mx-auto px-6 py-16 flex flex-col min-h-screen">
    <header class="mb-12 flex justify-between items-baseline border-b border-gray-200 pb-6">
        <h1 class="text-3xl font-bold">Writings <span class="text-gray-400 text-sm font-normal italic">/ API Driven</span></h1>
        <nav class="text-sm">
            <a href="index.html" class="text-blue-600 hover:underline">返回首页</a>
        </nav>
    </header>

    <main class="flex-1">
        <div id="loading-msg" class="text-gray-500 italic">正在从 GitHub 获取最新的文章列表，请稍候...</div>
        <ul id="blog-list" class="space-y-6">
            <!-- 动态生成列表项 -->
        </ul>
    </main>

    <script>
        const GITHUB_USERNAME = "faderaljim";
        const GITHUB_REPO = "ustc-homepage";
        
        document.addEventListener("DOMContentLoaded", async () => {
            const listEl = document.getElementById("blog-list");
            const loadingMsg = document.getElementById("loading-msg");
            
            try {
                // 使用 GitHub Contents API 拉取 blogs 目录下的文件
                const response = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/blogs/`);
                
                if (!response.ok) {
                    throw new Error("无法读取目录。确保 blogs 文件夹存在且仓库公开。");
                }
                
                const files = await response.json();
                const mdFiles = files.filter(f => f.name.endsWith('.md'));
                
                loadingMsg.style.display = "none";
                
                if (mdFiles.length === 0) {
                    listEl.innerHTML = "<p class='text-gray-400 italic'>暂无文章。</p>";
                    return;
                }
                
                // 将文件按某种逻辑排列 (默认 GitHub Contents API 按字母排序)
                // 这里倒序显示以便最新的(字母后的)靠前，当然最好是在提交时时间戳，这里采用简易反转
                mdFiles.reverse().forEach(f => {
                    const li = document.createElement("li");
                    // 点击后跳转到专门的阅读页面 article.html 并传递 file 参数
                    li.innerHTML = `
                        <h2 class="text-lg font-bold mb-1">
                            <a href="article.html?file=${encodeURIComponent(f.name)}" class="text-blue-600 hover:underline">${f.name.replace('.md', '')}</a>
                        </h2>
                        <div class="text-xs text-gray-400 font-mono">Size: ${(f.size / 1024).toFixed(2)} KB</div>
                    `;
                    listEl.appendChild(li);
                });
                
            } catch (error) {
                loadingMsg.textContent = "❌ 拉取列表失败: " + error.message;
                loadingMsg.className = "text-red-500 text-sm";
            }
        });
    </script>
</body>
</html>
