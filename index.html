<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人主页 | Serverless</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: "Georgia", "Times New Roman", serif; background-color: #fdfdfd; color: #111; line-height: 1.7; }
        .section-title { font-size: 1.1rem; font-weight: bold; margin-bottom: 0.75rem; border-bottom: 1px solid #eaeaea; padding-bottom: 0.25rem; text-transform: uppercase; letter-spacing: 0.05em; color: #555; }
        a { color: #0056b3; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body class="max-w-2xl mx-auto px-6 py-16">
    <header class="mb-12 flex flex-col md:flex-row justify-between items-baseline border-b border-gray-200 pb-6">
        <div>
            <h1 id="profile-name" class="text-3xl font-bold mb-1 opacity-0 transition-opacity duration-500"></h1>
            <p class="text-gray-500 italic text-sm">Academic Homepage</p>
        </div>
        <nav class="text-sm mt-4 md:mt-0 space-x-4">
            <a href="blog.html">Writings</a>
            <a href="admin.html" class="text-gray-400 hover:text-gray-700">Admin</a>
        </nav>
    </header>

    <main id="main-content">
        <section class="mb-10">
            <h2 class="section-title">Biography</h2>
            <div id="profile-resume" class="text-gray-800 text-sm">
                <span class="text-gray-400 italic">正在从 GitHub 获取配置...</span>
            </div>
        </section>

        <section class="mb-10">
            <h2 class="section-title">Research & Hobbies</h2>
            <div id="profile-hobbies" class="text-gray-800 text-sm"></div>
        </section>

        <section class="mb-10">
            <h2 class="section-title">Miscellaneous</h2>
            <div id="profile-other" class="text-gray-800 text-sm"></div>
        </section>

        <section class="mb-10">
            <h2 class="section-title">Selected Writings</h2>
            <ul id="recent-blogs" class="list-disc pl-5 text-sm space-y-2">
                <li id="index-blog-loading" class="text-gray-400 italic list-none">正在获取 Github 最新文章...</li>
            </ul>
        </section>
    </main>

    <script>
        const GITHUB_USERNAME = "faderaljim";
        const GITHUB_REPO = "ustc-homepage";

        function base64ToUtf8(str) {
            return decodeURIComponent(escape(window.atob(str)));
        }

        document.addEventListener("DOMContentLoaded", async () => {
            const configUrl = `https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/config.json`;
            const blogsUrl = `https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/blogs/`;
            
            try {
                // 并行请求 config 和 blogs 目录
                const [configRes, blogsRes] = await Promise.all([
                    fetch(configUrl),
                    fetch(blogsUrl)
                ]);

                // 渲染配置
                const emptyText = "<span class='text-gray-400 italic'>这个人很懒，什么都没留下</span>";
                let config = { profile: {}, blogMeta: {} };
                
                if(configRes.ok) {
                    const data = await configRes.json();
                    config = JSON.parse(base64ToUtf8(data.content));
                }
                const profile = config.profile || {};
                
                const nameEl = document.getElementById("profile-name");
                nameEl.textContent = profile.name || "未命名";
                nameEl.classList.remove("opacity-0");
                document.title = (profile.name || "未命名") + " - 个人主页";
                
                document.getElementById("profile-resume").innerHTML = profile.resume ? profile.resume.replace(/\n/g, '<br>') : emptyText;
                document.getElementById("profile-hobbies").innerHTML = profile.hobbies ? profile.hobbies.replace(/\n/g, '<br>') : emptyText;
                document.getElementById("profile-other").innerHTML = profile.other ? profile.other.replace(/\n/g, '<br>') : emptyText;

                // 渲染最新文章
                document.getElementById("index-blog-loading").style.display = "none";
                const recentBlogsList = document.getElementById("recent-blogs");
                
                if (blogsRes.ok) {
                    const files = await blogsRes.json();
                    const mdFiles = files.filter(f => f.name.endsWith('.md')).reverse().slice(0, 5); 
                    if(mdFiles.length === 0) {
                        recentBlogsList.innerHTML = "<li><span class='text-gray-400 italic'>暂无文章</span></li>";
                    } else {
                        mdFiles.forEach(f => {
                            const meta = config.blogMeta && config.blogMeta[f.name] ? config.blogMeta[f.name] : {};
                            const views = meta.views || 0;
                            const likes = meta.likes || 0;
                            const li = document.createElement("li");
                            li.innerHTML = `<a href="article.html?file=${encodeURIComponent(f.name)}">${f.name.replace('.md', '')}</a> <span class="text-xs text-gray-400 ml-2">👀${views} | 👍${likes}</span>`;
                            recentBlogsList.appendChild(li);
                        });
                    }
                }

            } catch(e) {
                console.error(e);
                document.getElementById("profile-resume").textContent = "拉取数据失败：" + e.message;
            }
        });
    </script>
</body>
</html>
