<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown 在线发布后台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>body { font-family: "Georgia", "Times New Roman", serif; background-color: #fcfcfc; }</style>
</head>
<body class="max-w-4xl mx-auto px-6 py-12">
    <header class="mb-8 flex justify-between items-center border-b border-gray-200 pb-4">
        <h1 class="text-2xl font-bold text-gray-800">极简 Markdown 发布后台</h1>
        <nav class="space-x-4 text-sm">
            <a href="index.html" class="text-blue-600 hover:underline">返回主页</a>
            <a href="blog.html" class="text-blue-600 hover:underline">查看博客</a>
        </nav>
    </header>

    <main class="bg-white p-6 border border-gray-200 rounded shadow-sm">
        <div class="mb-4">
            <label class="block text-sm font-bold mb-1 text-gray-700">GitHub Personal Access Token</label>
            <input type="password" id="gh-token" placeholder="ghp_xxxxxxxxxxxx" class="w-full border border-gray-300 p-2 rounded focus:outline-none focus:border-gray-500 font-mono text-sm">
            <p class="text-xs text-gray-400 mt-1">出于安全，该 Token 将仅在当前会话保存，用于本次提交鉴权。</p>
        </div>
        
        <div class="mb-4">
            <label class="block text-sm font-bold mb-1 text-gray-700">文章标题 (作为文件名，无需加后缀)</label>
            <input type="text" id="post-title" placeholder="例如：流形扫描算法探究" class="w-full border border-gray-300 p-2 rounded focus:outline-none focus:border-gray-500">
        </div>

        <div class="mb-6">
            <label class="block text-sm font-bold mb-1 text-gray-700">Markdown 纯文本正文 (支持 LaTeX 数学公式)</label>
            <textarea id="post-content" rows="18" class="w-full border border-gray-300 p-2 rounded focus:outline-none focus:border-gray-500 font-mono text-sm leading-relaxed" placeholder="# 标题\n\n正文内容...\n\n数学公式示例：\n$$ x = \\frac{-b \\pm \\sqrt{b^2 - 4ac}}{2a} $$"></textarea>
        </div>

        <div class="flex justify-between items-center pt-4 border-t border-gray-100">
            <span id="status-msg" class="text-xs text-gray-500">提示：提交过程可能需要几秒钟时间，发布后 GitHub Pages 会有一分钟左右的缓存延迟。</span>
            <button onclick="publishPost()" id="publish-btn" class="bg-gray-800 text-white px-8 py-2 rounded hover:bg-gray-700 transition font-bold disabled:bg-gray-400">提交发布</button>
        </div>
    </main>

    <script src="admin.js"></script>
</body>
</html>
