<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>博客后台管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>body { font-family: "Georgia", "Times New Roman", serif; background-color: #fcfcfc; }</style>
</head>
<body class="max-w-4xl mx-auto px-6 py-12">
    <header class="mb-8 flex justify-between items-center border-b border-gray-200 pb-4">
        <h1 class="text-2xl font-bold text-gray-800">后台管理控制台</h1>
        <nav class="space-x-4 text-sm">
            <a href="index.html" class="text-blue-600 hover:underline">查看主页</a>
            <button onclick="logout()" class="text-red-600 hover:underline">退出登录</button>
        </nav>
    </header>

    <main>
        <!-- 系统统计与设置 -->
        <section class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-12">
            <!-- 修改密码 -->
            <div class="bg-white p-6 border border-gray-200 rounded shadow-sm">
                <h2 class="text-lg font-bold mb-4 border-b pb-2">修改密码</h2>
                <div class="flex gap-2 mb-2">
                    <input type="password" id="new-password" placeholder="输入新密码" class="flex-1 border border-gray-300 p-2 rounded text-sm focus:outline-none focus:border-gray-500">
                    <button onclick="changePwd()" class="bg-gray-800 text-white px-4 py-2 rounded text-sm hover:bg-gray-700 transition">修改</button>
                </div>
                <span id="pwd-msg" class="text-green-600 text-xs hidden mt-1">密码已修改!</span>
            </div>
            
            <!-- 分类管理 -->
            <div class="bg-white p-6 border border-gray-200 rounded shadow-sm">
                <h2 class="text-lg font-bold mb-4 border-b pb-2">博客栏目管理</h2>
                <div class="flex gap-2 mb-4">
                    <input type="text" id="new-category" placeholder="新栏目名称" class="flex-1 border border-gray-300 p-2 rounded text-sm focus:outline-none focus:border-gray-500">
                    <button onclick="addCategory()" class="bg-gray-800 text-white px-4 py-2 rounded text-sm hover:bg-gray-700 transition">添加</button>
                </div>
                <ul id="category-list" class="space-y-2 text-sm">
                    <!-- Dynamic -->
                </ul>
            </div>
        </section>

        <!-- 个人资料设置 -->
        <section class="mb-12 bg-white p-6 border border-gray-200 rounded shadow-sm">
            <h2 class="text-xl font-bold mb-6 border-b pb-2">个人资料设置</h2>
            <div class="mb-4">
                <label class="block text-sm font-bold mb-1 text-gray-700">姓名</label>
                <input type="text" id="edit-name" class="w-full border border-gray-300 p-2 rounded focus:outline-none focus:border-gray-500">
            </div>
            <div class="mb-4">
                <label class="block text-sm font-bold mb-1 text-gray-700">履历 (支持换行)</label>
                <textarea id="edit-resume" rows="4" class="w-full border border-gray-300 p-2 rounded focus:outline-none focus:border-gray-500"></textarea>
            </div>
            <div class="mb-4">
                <label class="block text-sm font-bold mb-1 text-gray-700">研究与爱好 (支持换行)</label>
                <textarea id="edit-hobbies" rows="3" class="w-full border border-gray-300 p-2 rounded focus:outline-none focus:border-gray-500"></textarea>
            </div>
            <div class="mb-6">
                <label class="block text-sm font-bold mb-1 text-gray-700">其他资料 (支持换行)</label>
                <textarea id="edit-other" rows="3" class="w-full border border-gray-300 p-2 rounded focus:outline-none focus:border-gray-500"></textarea>
            </div>
            <div class="flex items-center">
                <button onclick="saveProfileData()" class="bg-gray-800 text-white px-6 py-2 rounded hover:bg-gray-700 transition">保存资料</button>
                <span id="profile-msg" class="ml-4 text-green-600 text-sm hidden">保存成功!</span>
            </div>
        </section>

        <!-- 博客文章管理 -->
        <section class="mb-12 bg-white p-6 border border-gray-200 rounded shadow-sm">
            <div class="flex justify-between items-center mb-6 border-b pb-2">
                <h2 class="text-xl font-bold">博客文章管理</h2>
                <a href="edit-blog.html" class="bg-blue-600 text-white px-4 py-2 rounded text-sm hover:bg-blue-700 transition">新建博客</a>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b bg-gray-50">
                            <th class="py-3 px-4 text-sm text-gray-600">标题</th>
                            <th class="py-3 px-4 text-sm text-gray-600 w-24">栏目</th>
                            <th class="py-3 px-4 text-sm text-gray-600 w-32">数据</th>
                            <th class="py-3 px-4 text-sm text-gray-600 w-32">操作</th>
                        </tr>
                    </thead>
                    <tbody id="admin-blog-list">
                        <!-- Dynamic -->
                    </tbody>
                </table>
            </div>
        </section>

        <!-- 主页留言板管理 -->
        <section class="bg-white p-6 border border-gray-200 rounded shadow-sm">
            <h2 class="text-xl font-bold mb-6 border-b pb-2">主页留言板管理</h2>
            <div id="admin-guestbook-list" class="space-y-4">
                <!-- Dynamic -->
            </div>
        </section>
    </main>

    <script src="data.js"></script>
    <script>
        if (sessionStorage.getItem("isAdmin") !== "true") {
            window.location.href = "login.html";
        }

        function logout() {
            sessionStorage.removeItem("isAdmin");
            window.location.href = "login.html";
        }

        document.addEventListener("DOMContentLoaded", () => {
            const profile = getProfile();
            document.getElementById("edit-name").value = profile.name || "";
            document.getElementById("edit-resume").value = profile.resume || "";
            document.getElementById("edit-hobbies").value = profile.hobbies || "";
            document.getElementById("edit-other").value = profile.other || "";

            loadCategories();
            loadBlogs();
            loadGuestbook();
        });

        function changePwd() {
            const pwd = document.getElementById("new-password").value.trim();
            if(pwd) {
                setPassword(pwd);
                const msg = document.getElementById("pwd-msg");
                msg.classList.remove("hidden");
                document.getElementById("new-password").value = "";
                setTimeout(() => msg.classList.add("hidden"), 2000);
            }
        }

        function saveProfileData() {
            const profile = {
                name: document.getElementById("edit-name").value,
                resume: document.getElementById("edit-resume").value,
                hobbies: document.getElementById("edit-hobbies").value,
                other: document.getElementById("edit-other").value
            };
            saveProfile(profile);
            const msg = document.getElementById("profile-msg");
            msg.classList.remove("hidden");
            setTimeout(() => msg.classList.add("hidden"), 2000);
        }

        function loadCategories() {
            const cats = getCategories();
            const list = document.getElementById("category-list");
            list.innerHTML = "";
            cats.forEach(c => {
                const li = document.createElement("li");
                li.className = "flex justify-between items-center bg-gray-50 px-3 py-1 rounded";
                li.innerHTML = `
                    <span>${c.name}</span>
                    <button onclick="handleDelCat(${c.id})" class="text-red-500 hover:underline">删除</button>
                `;
                list.appendChild(li);
            });
        }

        function addCategory() {
            const name = document.getElementById("new-category").value.trim();
            if(name) {
                saveCategory({ name: name });
                document.getElementById("new-category").value = "";
                loadCategories();
                loadBlogs();
            }
        }

        function handleDelCat(id) {
            if(confirm("确定删除该栏目吗？原属该栏目的文章将被归为无栏目。")) {
                deleteCategory(id);
                loadCategories();
                loadBlogs();
            }
        }

        function loadBlogs() {
            const blogs = getBlogs();
            const cats = getCategories();
            const tbody = document.getElementById("admin-blog-list");
            tbody.innerHTML = "";
            blogs.sort((a, b) => new Date(b.date) - new Date(a.date)).forEach(blog => {
                const catName = cats.find(c => c.id == blog.categoryId)?.name || "无";
                const tr = document.createElement("tr");
                tr.className = "border-b hover:bg-gray-50 transition";
                tr.innerHTML = `
                    <td class="py-3 px-4">${blog.title || "<span class='text-gray-400 italic'>未命名文章</span>"}</td>
                    <td class="py-3 px-4 text-sm text-gray-500">${catName}</td>
                    <td class="py-3 px-4 text-xs text-gray-400">👀 ${blog.views || 0} | 👍 ${blog.likes || 0}</td>
                    <td class="py-3 px-4 text-sm">
                        <a href="edit-blog.html?id=${blog.id}" class="text-blue-600 hover:underline mr-3">编辑</a>
                        <button onclick="handleDelete(${blog.id})" class="text-red-600 hover:underline">删除</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function handleDelete(id) {
            if (confirm("确定要删除这篇博客吗？操作不可逆。")) {
                deleteBlog(id);
                loadBlogs();
            }
        }

        function loadGuestbook() {
            const gb = getGuestbook().sort((a,b) => b.id - a.id);
            const list = document.getElementById("admin-guestbook-list");
            list.innerHTML = "";
            if(gb.length === 0) {
                list.innerHTML = "<p class='text-sm text-gray-400'>暂无留言。</p>";
                return;
            }
            gb.forEach(m => {
                const div = document.createElement("div");
                div.className = "p-4 border border-gray-100 bg-gray-50 rounded text-sm";
                let currentReplyHTML = "";
                if(m.reply) {
                    currentReplyHTML = `<div class="mt-2 text-blue-600 bg-blue-50 p-2 rounded flex justify-between items-center">
                        <span class="italic">作者回复: ${m.reply}</span>
                    </div>`;
                }

                div.innerHTML = `
                    <div class="flex justify-between font-bold mb-1">
                        <span>${m.author} <span class="font-normal text-xs text-gray-400 ml-2">${m.date}</span></span>
                        <button onclick="delGB(${m.id})" class="text-red-500 hover:underline text-xs">删除</button>
                    </div>
                    <p class="text-gray-700 mb-2">${m.content}</p>
                    ${currentReplyHTML}
                    <div class="mt-2 flex gap-2">
                        <input type="text" id="gb-reply-${m.id}" placeholder="回复内容..." class="flex-1 border border-gray-300 px-2 py-1 rounded text-xs">
                        <button onclick="submitGBReply(${m.id})" class="bg-gray-200 px-3 py-1 rounded text-xs hover:bg-gray-300">回复</button>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        function delGB(id) {
            if(confirm("确定删除这条留言吗？")) {
                deleteGuestbook(id);
                loadGuestbook();
            }
        }

        function submitGBReply(id) {
            const val = document.getElementById(`gb-reply-${id}`).value.trim();
            replyGuestbook(id, val);
            loadGuestbook();
        }
    </script>
</body>
</html>
